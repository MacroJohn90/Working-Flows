name: Daily Contribution Counter
 
# This workflow runs on a schedule. It updates a counter file and commits
# the change. GitHub runs this task for you. Your computer does not need
# to be on.
 
on:
  schedule:
    # This cron value means "every day at 09:00 UTC".
    # Change the time to suit your timezone.
    - cron: "0 9 * * *"
  workflow_dispatch:
    # This line lets you run the workflow by hand from the Actions tab,
    # so you can test it before you rely on the schedule.
 
permissions:
  contents: write
  # This permission lets the workflow push commits back to the repository.
 
jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
 
      - name: Update the counter file
        run: |
          if [ ! -f counter.txt ]; then
            echo "0" > counter.txt
          fi
          count=$(cat counter.txt)
          new_count=$((count + 1))
          echo "$new_count" > counter.txt
          echo "New count: $new_count"
 
      - name: Commit and push the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "Update contribution counter to $(cat counter.txt)"
          git push
